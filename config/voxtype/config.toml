# Voxtype configuration — ChatGPT (Codex) remote-transcription preset
# Location after install: ~/.config/voxtype/config.toml
#
# This preset routes transcription to the ChatGPT backend through the local
# proxy instead of running a local Whisper model. See the repo README.

state_file = "auto"
engine = "whisper"

[hotkey]
# The hotkey is bound in Hyprland (see config/hypr/voxtype.conf), not here.
enabled = false

[audio]
device = "default"
# Whisper consumes 16 kHz mono; leave this unless you know better.
sample_rate = 16000
# ponytail: keep a safety cap; raise it if real use needs more than 15 minutes.
max_duration_secs = 900
pause_media = true

[whisper]
# ---- ChatGPT remote transcription (the whole point of this repo) ----
# "remote" sends audio to the local proxy (codex-dictate-proxy), which forwards
# it to https://chatgpt.com/backend-api/transcribe using your ~/.codex/auth.json.
# To go back to a local GPU model: set mode = "local" and pick a `model` below.
mode = "remote"
remote_endpoint = "http://127.0.0.1:8377"
remote_model = "whisper-1"
remote_api_key = "proxy-ignored"   # proxy uses ~/.codex/auth.json; this is ignored
remote_timeout_secs = 900

# Only used when mode = "local". Safe to leave; ignored in remote mode.
model = "large-v3"

# "auto" detects language per utterance (good for bilingual dictation).
language = "auto"
translate = false

# clipboard mode: the daemon only copies the transcript; it does NOT type or
# paste. Pasting is done by the post_process hook (voxtype-paste-focus), which
# picks the paste key from the focused window — Ctrl+Shift+V in terminals,
# Ctrl+V everywhere else — so dictation lands in any input.
#
# Why not keystroke "type" mode: injecting non-ASCII text (Chinese, etc.) via
# the virtual keyboard makes wlroots compositors fire stray single-key binds
# (screenshot, calculator, media keys). Clipboard + a single Ctrl+V/Ctrl+Shift+V
# combo (a modified key, bound to nothing) avoids that entirely.
[output]
mode = "clipboard"

# No keystroke fallback: if the paste hook fails the text still sits on the
# clipboard for a manual paste — better than typing raw text and tripping binds.
fallback_to_clipboard = false
type_delay_ms = 0

# Paste hook: cleans the transcript (if you have a voxtype-cleanup helper) and
# pastes it into the focused window. setup.sh installs the script to
# ~/.local/bin and rewrites the __HOME__ placeholder below to your real $HOME
# (voxtype does not expand ~ or env vars in this path).
[output.post_process]
command = "__HOME__/.local/bin/voxtype-paste-focus"
timeout_ms = 3000

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = false

[text]
# Leave word fixups to the model. Add local overrides here only if you want them.
# replacements = { "pullrequest" = "pull request" }
