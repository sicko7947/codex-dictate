# Hyprland keybindings for Voxtype dictation.
#
# If you are on Omarchy, these defaults already exist — you do NOT need this file.
# Otherwise, copy this into ~/.config/hypr/ and add to ~/.config/hypr/hyprland.conf:
#
#     source = ~/.config/hypr/voxtype.conf
#
# Then reload Hyprland (hyprctl reload) or log out/in.

# Toggle dictation: press once to start, press again to stop + transcribe.
bindd = SUPER CTRL, X, Toggle dictation, exec, voxtype record toggle

# Push-to-talk: hold F9 to record, release to transcribe.
bindd  = , F9, Start dictation (push-to-talk), exec, voxtype record start
binddr = , F9, Stop dictation (push-to-talk),  exec, voxtype record stop
