# Remote (ChatGPT) transcription sends ONE HTTP request per audio chunk.
# Voxtype's --eager-processing splits an utterance into several context-free
# chunks, which garbles the text at chunk boundaries. We override ExecStart to
# run a plain daemon with NO --eager-processing, so each push-to-talk is sent as
# a single request with full context.
#
# If you also use local mode and want terminology biasing there, append e.g.
#   --initial-prompt "Common terms: Kubernetes, Postgres, GraphQL, ..."
# (it is a no-op in remote mode, so leaving it on is harmless).
#
# --paste --restore-clipboard: deliver text via clipboard + Ctrl+V instead of
# simulating keystrokes. On wlroots compositors (Hyprland/Sway) the default
# "type" driver (wtype) injects per-character keycodes through a virtual
# keyboard; for non-ASCII text (e.g. Chinese/Japanese) wtype assigns transient
# keycodes that the compositor's GLOBAL keybind layer intercepts, randomly
# firing single-key binds (PRINT=screenshot, XF86Calculator, media keys, ...).
# Pasting sends a single Ctrl+V combo (a modified key, bound to nothing), so no
# global bind fires. restore-clipboard puts your previous clipboard back ~200ms
# after the paste.
#
# Caveat: Ctrl+V is "paste" in GUI apps/browsers/editors but NOT in raw
# terminals (there it's literal-insert; paste is usually Ctrl+Shift+V). If you
# dictate into a terminal, set the key explicitly, e.g. append
#   --paste-keys ctrl+shift+v
# or drop --paste here to fall back to keystroke typing.
[Service]
ExecStart=
ExecStart=/usr/bin/voxtype --paste --restore-clipboard daemon
