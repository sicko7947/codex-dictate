# Remote (ChatGPT) transcription sends ONE HTTP request per audio chunk.
# Voxtype's --eager-processing splits an utterance into several context-free
# chunks, which garbles the text at chunk boundaries. We override ExecStart to
# run a plain daemon with NO --eager-processing, so each push-to-talk is sent as
# a single request with full context.
#
# If you also use local mode and want terminology biasing there, append e.g.
#   --initial-prompt "Common terms: Kubernetes, Postgres, GraphQL, ..."
# (it is a no-op in remote mode, so leaving it on is harmless).
#
# Output/paste is handled in config.toml, NOT here: mode = "clipboard" plus the
# post_process hook (voxtype-paste-focus) pastes into the focused window with
# the right key per app (Ctrl+Shift+V in terminals, Ctrl+V elsewhere). We do
# NOT pass --paste, because that forces a single fixed paste key and would
# double-paste on top of the hook.
[Service]
ExecStart=
ExecStart=/usr/bin/voxtype daemon
