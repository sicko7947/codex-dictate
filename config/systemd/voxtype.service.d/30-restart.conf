# Same reasoning as codex-dictate-proxy.service: this unit is
# PartOf=graphical-session.target, so a session bounce (relogin, compositor
# restart) sends a clean SIGTERM that Restart=on-failure ignores — the daemon
# stays dead and dictation silently stops until a manual restart. Restart=always
# revives it on a bounce while still staying down on a real logout (the whole
# target stops as one transaction).
[Service]
Restart=always
RestartSec=3
